# EasyBot 插件工程（独立仓库，作者无需 clone 主仓）
#
# 命名规则：插件名 = 仓库名 = package name = `easybot-xxx`（官方前缀）。
#   - 可执行产物名 = bin 名 = `easybot-hello-adapter`（Windows 为 `.exe`）
#   - platform_name() / plugin.yaml `name` 与 `command` / 市场中的 name 均为 `easybot-hello-adapter`
#
# 架构：**进程外插件**——本工程编译为独立可执行文件，宿主 EasyBot 把它作为
#   子进程启动，双方通过 stdin/stdout 逐行 JSON（easybot-plugin-protocol）通信。
#   不使用 dlopen / cdylib（官方 Linux 发行版是 musl 全静态二进制，没有动态加载器）。
#
# SDK 依赖走 **git tag**（作者端编译独立）：
#   easybot-plugin-sdk = { git = ".../EasyBot", tag = "v0.0.42", package = "easybot-plugin-sdk" }
#   - `testing` feature（PluginTestHost / ProcessPluginTestHost）只放进 [dev-dependencies]。
#   - 本地联调把 SDK 指向本地主仓 checkout 的 [patch] 见 `.cargo/config.toml`。
#   - 更换 tag 前先确认该版本已包含你需要的 SDK API 与协议版本（见 docs/plugin-development-guide.md）。

[package]
name = "easybot-hello-adapter"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "EasyBot 官方插件入门样例：最小可跑的 echo 适配器（教学用）"
license = "GPL-3.0-only"
publish = false

[lib]
# rlib：让 `cargo test` 与 `src/main.rs` 能链接本 crate。
# （不再需要 cdylib：进程外插件是独立可执行文件。）
crate-type = ["rlib"]

[[bin]]
# 进程外插件入口：产物名 = bin 名，宿主据此 spawn。
name = "easybot-hello-adapter"
path = "src/main.rs"

[dependencies]
# SDK 本体（无 testing feature → 产物不携带测试宿主）。
easybot-plugin-sdk = { git = "https://github.com/EasyIndie/EasyBot", tag = "v0.0.42", package = "easybot-plugin-sdk" }
# 序列化/日志：真实适配器通常还需要 `serde = { version = "1", features = ["derive"] }`
#（序列化平台请求体），本样例只用 serde_json 的 json! 宏，故不引入 serde。
serde_json = "1"
tracing = "0.1"
# 进程外架构下插件与宿主是两个进程，值经 JSON 序列化传递：
# 不存在跨堆所有权问题，也无需关心全局分配器（可自由使用 mimalloc 等）。

[dev-dependencies]
# testing feature 只在测试目标编译：提供 PluginTestHost（内存宿主离线测试）。
easybot-plugin-sdk = { git = "https://github.com/EasyIndie/EasyBot", tag = "v0.0.42", package = "easybot-plugin-sdk", features = ["testing"] }
# PluginTestHost 与宿主共享 tokio 运行时（#[tokio::test]）；recv_event 需 time。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# 发布 profile（与主仓 workspace 对齐）：减小产物体积。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = 0
